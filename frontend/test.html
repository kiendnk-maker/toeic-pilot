<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TOEIC Pilot — Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --bg2: #111118;
  --glass: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --accent: #7c6af7;
  --accent-dim: rgba(124,106,247,0.15);
  --accent-glow: rgba(124,106,247,0.25);
  --success: #22c55e;
  --success-dim: rgba(34,197,94,0.15);
  --danger: #ef4444;
  --danger-dim: rgba(239,68,68,0.15);
  --warning: #f59e0b;
  --info: #06b6d4;
  
  --text: #f0f0f5;
  --text2: #8888a0;
  
  --font: 'Inter', system-ui, sans-serif;
  --font-d: 'Orbitron', monospace;
  --font-m: 'JetBrains Mono', monospace;
  
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh; min-height: 100dvh;
  background: var(--bg);
  font-family: var(--font);
  color: var(--text);
  overflow: hidden; /* Prevent body scroll, manage in container */
  display: flex; flex-direction: column;
}

/* Header */
.header {
  padding: 16px 20px;
  background: rgba(10,10,15,0.8);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  z-index: 10;
}
.title { font-family: var(--font-d); font-weight: 700; letter-spacing: 2px; font-size: 1rem; color: var(--text); }
.title span { color: var(--accent); }
.timer {
  font-family: var(--font-m); font-size: 1.1rem;
  color: var(--info); font-weight: 600;
  text-shadow: 0 0 10px rgba(6,182,212,0.4);
}
.timer.warn { color: var(--warning); text-shadow: 0 0 10px rgba(245,158,11,0.4); }
.timer.danger { color: var(--danger); text-shadow: 0 0 10px rgba(239,68,68,0.4); }

/* Progress Bar */
.progress-wrap { padding: 0 20px; margin-top: 10px; }
.progress-bg {
  height: 6px; background: rgba(255,255,255,0.05);
  border-radius: 6px; overflow: hidden;
}
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--info), var(--accent));
  transition: width 0.3s var(--ease);
}
.progress-text {
  font-family: var(--font-m); font-size: 0.65rem; color: var(--text2);
  text-align: right; margin-top: 4px; letter-spacing: 1px;
}

/* Main Container */
.main { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
.carousel {
  position: relative; width: 100%; max-width: 600px; height: 100%;
  overflow: hidden; padding: 20px; display: flex; align-items: center;
}

/* Card */
.card {
  position: absolute; left: 20px; right: 20px;
  background: var(--glass);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  transition: transform 0.4s var(--ease), opacity 0.4s var(--ease);
  opacity: 0; pointer-events: none; transform: translateX(50px);
}
.card.active { opacity: 1; pointer-events: auto; transform: translateX(0); z-index: 2; }
.card.prev { transform: translateX(-50px); }
.card.next { transform: translateX(50px); }

.q-num {
  font-family: var(--font-d); font-size: 0.7rem; color: var(--accent);
  letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase;
}
.q-stem { font-size: 1.1rem; line-height: 1.7; margin-bottom: 24px; color: var(--text); }
.q-stem b { color: var(--accent); }

/* Options */
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 12px;
  padding: 16px; background: rgba(0,0,0,0.2);
  border: 1px solid var(--border); border-radius: 12px;
  color: var(--text); font-size: 0.95rem; cursor: pointer;
  transition: all 0.2s var(--ease);
}
.opt:hover:not(.locked) {
  background: rgba(124,106,247,0.1); border-color: var(--accent);
  transform: translateX(4px);
}
.opt.selected { background: var(--accent-dim); border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
.opt-key {
  background: rgba(255,255,255,0.06); padding: 4px 12px;
  border-radius: 8px; font-family: var(--font-m); font-size: 0.75rem;
  color: var(--text2);
}
.opt.selected .opt-key { background: var(--accent); color: #fff; }

/* Review Mode Colors */
.opt.correct-ans { background: var(--success-dim); border-color: var(--success); }
.opt.correct-ans .opt-key { background: var(--success); color: #000; }
.opt.wrong-ans { background: var(--danger-dim); border-color: var(--danger); }
.opt.wrong-ans .opt-key { background: var(--danger); color: #000; }

.explain {
  display: none; margin-top: 16px; padding: 12px;
  background: rgba(6,182,212,0.1); border-left: 2px solid var(--info);
  border-radius: 0 8px 8px 0; font-size: 0.85rem; color: var(--text2); line-height: 1.6;
}

/* Navigation */
.nav-btns {
  display: flex; justify-content: space-between;
  width: 100%; max-width: 600px; padding: 0 20px 20px;
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 5;
}
.nav-btn {
  width: 44px; height: 44px;
  background: var(--glass); border: 1px solid var(--border);
  border-radius: 50%; color: var(--text); font-size: 1.2rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; backdrop-filter: blur(10px);
}
.nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: #fff; }
.nav-btn:disabled { opacity: 0.3; cursor: default; }

/* Submit Button */
.submit-fab {
  position: fixed; bottom: 20px; right: 20px; z-index: 20;
  padding: 14px 24px;
  background: linear-gradient(135deg, var(--accent), #9b8fff);
  border: none; border-radius: 30px;
  color: #fff; font-family: var(--font-d); font-size: 0.9rem; letter-spacing: 2px;
  box-shadow: 0 4px 20px var(--accent-glow);
  cursor: pointer; display: none;
  animation: pulseFab 2s infinite, slideUp 0.4s var(--ease);
}
@keyframes pulseFab { 0%,100%{box-shadow:0 4px 20px var(--accent-glow);} 50%{box-shadow:0 4px 40px rgba(124,106,247,0.6);} }
@keyframes slideUp { from{transform:translateY(100px);opacity:0;} to{transform:translateY(0);opacity:1;} }

/* Score Modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
  z-index: 100; display: none; justify-content: center; align-items: center;
}
.modal {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 24px; padding: 40px; width: 90%; max-width: 400px;
  text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  animation: popIn 0.5s var(--ease);
}
@keyframes popIn { from{transform:scale(0.8);opacity:0;} to{transform:scale(1);opacity:1;} }
.score-circle {
  width: 120px; height: 120px; margin: 0 auto 20px;
  border-radius: 50%; border: 4px solid var(--accent);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 0 30px var(--accent-glow);
}
.score-val { font-family: var(--font-d); font-size: 2.5rem; font-weight: 900; color: #fff; }
.score-tot { font-family: var(--font-m); font-size: 0.9rem; color: var(--text2); }
.modal-title { font-family: var(--font-d); font-size: 1.2rem; color: var(--text); margin-bottom: 8px; }
.modal-btn {
  width: 100%; padding: 14px; margin-top: 24px;
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  border-radius: 12px; color: var(--text); font-family: var(--font-d); letter-spacing: 1px;
  cursor: pointer; transition: all 0.2s;
}
.modal-btn:hover { background: rgba(255,255,255,0.1); border-color: #fff; }

.loading { font-family: var(--font-m); text-align: center; width: 100%; color: var(--text2); }

@media (max-width: 600px) {
  .card { padding: 20px 16px; left: 16px; right: 16px; }
  .nav-btns { padding: 0 16px 20px; }
  .q-stem { font-size: 1rem; }
}
</style>
</head>
<body>

<div class="header">
  <div class="title">TOEIC <span>PILOT</span></div>
  <div class="timer" id="timer">00:00</div>
</div>

<div class="progress-wrap">
  <div class="progress-bg"><div class="progress-fill" id="pgFill"></div></div>
  <div class="progress-text"><span id="pgText">0</span> / 30</div>
</div>

<div class="main">
  <div class="carousel" id="carousel">
    <div class="loading" id="loading">Loading assessment...</div>
  </div>
  
  <div class="nav-btns" id="navBtns" style="display:none;">
    <button class="nav-btn" id="btnPrev" onclick="nav(-1)">❮</button>
    <button class="nav-btn" id="btnNext" onclick="nav(1)" disabled>❯</button>
  </div>
</div>

<button class="submit-fab" id="submitBtn" onclick="submitTest()">SUBMIT TEST</button>

<div class="modal-bg" id="scoreModal">
  <div class="modal">
    <div class="score-circle">
      <div class="score-val" id="scoreVal">0</div>
      <div class="score-tot">/ 30</div>
    </div>
    <div class="modal-title">Assessment Complete</div>
    <div style="font-size:0.85rem; color:var(--text2);">Data has been saved.</div>
    <button class="modal-btn" onclick="reviewMode()">REVIEW ANSWERS</button>
    <button class="modal-btn" onclick="window.location.href='/static/index.html'" style="margin-top:10px;">FINISH</button>
  </div>
</div>

<script>
const S = {
  pid: new URLSearchParams(window.location.search).get('pid') || 'P001',
  group: new URLSearchParams(window.location.search).get('group') || 'B',
  day: new URLSearchParams(window.location.search).get('day') || 1,
  mode: new URLSearchParams(window.location.search).get('mode') || 'pretest',
  qs: [],
  answers: [],
  idx: 0,
  maxIdx: 0, // highest unlocked
  startTime: Date.now(),
  timerInt: null,
  isReview: false
};

const letters = ['A','B','C','D'];

async function init() {
  document.getElementById('timer').classList.toggle('warn', S.mode === 'pretest');
  document.title = `TOEIC Pilot — ${S.mode.toUpperCase()}`;
  
  try {
    const r = await fetch('/api/questions?day=' + S.day + '&set=' + S.mode);
    if (!r.ok) throw new Error('API Error');
    S.qs = await r.json();
    if(S.qs.length === 0) throw new Error('No questions');
    
    // Default 30 questions limit if API returns more
    if(S.qs.length > 30) S.qs = S.qs.slice(0, 30);
    S.answers = new Array(S.qs.length).fill(-1);
    
    renderCards();
    updateUI();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('navBtns').style.display = 'flex';
    
    S.timerInt = setInterval(updateTimer, 1000);
  } catch(e) {
    document.getElementById('loading').textContent = 'Error loading questions.';
  }
}

function updateTimer() {
  if (S.isReview) return;
  const s = Math.floor((Date.now() - S.startTime) / 1000);
  const m = Math.floor(s / 60);
  const rs = s % 60;
  const str = m.toString().padStart(2, '0') + ':' + rs.toString().padStart(2, '0');
  const tEl = document.getElementById('timer');
  tEl.textContent = str;
  if(s > 600) tEl.className = 'timer warn';
  if(s > 900) tEl.className = 'timer danger';
}

function renderCards() {
  const container = document.getElementById('carousel');
  S.qs.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = `card ${i === 0 ? 'active' : 'next'}`;
    card.id = `card-${i}`;
    
    let optsHtml = '';
    q.options.forEach((opt, optIdx) => {
      optsHtml += `<div class="opt" onclick="selectOpt(${i}, ${optIdx})" id="opt-${i}-${optIdx}">
        <span class="opt-key">${letters[optIdx]}</span>
        <span>${String(opt).replace(/</g, '&lt;')}</span>
      </div>`;
    });

    card.innerHTML = `
      <div class="q-num">Question ${i+1}</div>
      <div class="q-stem">${String(q.stem).replace(/(_{2,})/g, '<b>$1</b>')}</div>
      <div class="opts">${optsHtml}</div>
      <div class="explain" id="exp-${i}"><b>Analysis:</b> ${String(q.explanation).replace(/</g, '&lt;')}</div>
    `;
    container.appendChild(card);
  });
}

function selectOpt(qIdx, optIdx) {
  if (S.isReview) return;
  if (qIdx > S.maxIdx) return; // locked
  
  // Unselect all in this card
  for(let i=0; i<4; i++) {
    const el = document.getElementById(`opt-${qIdx}-${i}`);
    if(el) el.classList.remove('selected');
  }
  
  // Select new
  document.getElementById(`opt-${qIdx}-${optIdx}`).classList.add('selected');
  S.answers[qIdx] = optIdx;
  
  // Unlock next
  if (qIdx === S.maxIdx && S.maxIdx < S.qs.length - 1) {
    S.maxIdx++;
    setTimeout(() => nav(1), 300);
  }
  
  checkSubmit();
  updateUI();
}

function nav(dir) {
  const newIdx = S.idx + dir;
  if (newIdx < 0 || newIdx >= S.qs.length) return;
  if (!S.isReview && newIdx > S.maxIdx) return; // locked
  
  const curCard = document.getElementById(`card-${S.idx}`);
  const newCard = document.getElementById(`card-${newIdx}`);
  
  curCard.className = `card ${dir > 0 ? 'prev' : 'next'}`;
  newCard.className = 'card active';
  
  S.idx = newIdx;
  updateUI();
}

function updateUI() {
  document.getElementById('btnPrev').disabled = (S.idx === 0);
  document.getElementById('btnNext').disabled = (!S.isReview && S.idx >= S.maxIdx) || (S.idx === S.qs.length - 1);
  
  const answered = S.answers.filter(a => a !== -1).length;
  document.getElementById('pgFill').style.width = (answered / S.qs.length * 100) + '%';
  document.getElementById('pgText').textContent = answered;
}

function checkSubmit() {
  const allDone = !S.answers.includes(-1);
  const btn = document.getElementById('submitBtn');
  btn.style.display = allDone ? 'block' : 'none';
}

async function submitTest() {
  clearInterval(S.timerInt);
  document.getElementById('submitBtn').style.display = 'none';
  
  let score = 0;
  S.answers.forEach((ans, i) => {
    if(ans === S.qs[i].correct_idx) score++;
  });
  
  try {
    await fetch('/api/test/submit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        participant_id: S.pid,
        group_type: S.group,
        test_type: S.mode,
        score: score,
        total: S.qs.length
      })
    });
  } catch(e) {}
  
  animateScore(score);
  document.getElementById('scoreModal').style.display = 'flex';
}

function animateScore(target) {
  const el = document.getElementById('scoreVal');
  let cur = 0;
  const step = () => {
    if (cur < target) {
      cur++;
      el.textContent = cur;
      requestAnimationFrame(step);
    } else {
      el.textContent = target;
    }
  };
  requestAnimationFrame(step);
}

function reviewMode() {
  document.getElementById('scoreModal').style.display = 'none';
  S.isReview = true;
  S.maxIdx = S.qs.length - 1; // unlock all
  S.idx = 0; // jump to first
  
  // Apply colors
  S.qs.forEach((q, i) => {
    const userAns = S.answers[i];
    const keyAns = q.correct_idx;
    
    for(let j=0; j<4; j++) {
      const opt = document.getElementById(`opt-${i}-${j}`);
      if(opt) {
        opt.classList.add('locked'); // disable hover
        opt.classList.remove('selected');
        if(j === keyAns) opt.classList.add('correct-ans');
        else if(j === userAns) opt.classList.add('wrong-ans');
      }
    }
    document.getElementById(`exp-${i}`).style.display = 'block';
    
    // Hide current card and jump to first
    document.getElementById(`card-${i}`).className = `card next`;
  });
  
  document.getElementById('card-0').className = 'card active';
  updateUI();
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (document.getElementById('scoreModal').style.display === 'flex') return;
  
  if (e.key === 'ArrowLeft') nav(-1);
  if (e.key === 'ArrowRight') nav(1);
  
  if (!S.isReview) {
    const kMap = {'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
    const i = kMap[e.key.toLowerCase()];
    if (i !== undefined) selectOpt(S.idx, i);
    if (e.key === 'Enter' && document.getElementById('submitBtn').style.display === 'block') {
      submitTest();
    }
  }
});

// Swipe support
let ts = null;
document.addEventListener('touchstart', e => { ts = e.touches[0].clientX; });
document.addEventListener('touchend', e => {
  if(!ts) return;
  const te = e.changedTouches[0].clientX;
  if(ts - te > 50) nav(1);
  else if(te - ts > 50) nav(-1);
  ts = null;
});

init();
</script>
</body>
</html>
